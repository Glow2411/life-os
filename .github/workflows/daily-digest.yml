name: Daily digest

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 7:00 AM Toronto in summer (6:00 AM in winter)
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      send_even_if_empty:
        description: 'Send a test email even if nothing is due'
        type: boolean
        default: false

permissions:
  contents: write           # only used by the keep-alive step below

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      TZ: America/Toronto   # decides what "today" means for due dates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          APP_URL: ${{ vars.APP_URL }}
          SEND_WHEN_EMPTY: ${{ inputs.send_even_if_empty }}

      # GitHub pauses scheduled jobs after 60 days without commits.
      # This makes an empty commit every ~50 days so the digest keeps running.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "life-os-bot"
            git config user.email "life-os-bot@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive"
            git push
          fi
