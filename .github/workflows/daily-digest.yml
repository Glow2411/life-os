name: Daily digest

# The morning summary is now sent by the Supabase "notify" Edge Function (Settings → Notifications → Morning summary).
# This workflow is kept as a manual backup only.
on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      send_even_if_empty:
        description: 'Send a test email even if nothing is due'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      TZ: America/Toronto   # decides what "today" means for due dates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          APP_URL: ${{ vars.APP_URL }}
          SEND_WHEN_EMPTY: ${{ inputs.send_even_if_empty }}
